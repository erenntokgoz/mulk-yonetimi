# Production API on the shared Ubuntu host. Database: Azure SQL (see docs/deploy-ubuntu-azure.md).
# Run from the repo root on the server:  docker compose -f deploy/compose.api.yaml up -d --build
name: mulk-yonetimi

services:
  api:
    build: ../backend
    image: mulk-yonetimi-api:latest
    restart: unless-stopped
    env_file: ./api.env
    # Host networking: the host refuses bridge-network traffic to its own public IP, so Mailu (published on the
    # public IP) is only reachable from the host namespace. Kestrel binds to loopback only; nginx proxies to it.
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5180
      Network__KnownProxies__0: 127.0.0.1
    volumes:
      - dataprotection-keys:/keys
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dataprotection-keys:
    name: mulk-yonetimi-dataprotection-keys
