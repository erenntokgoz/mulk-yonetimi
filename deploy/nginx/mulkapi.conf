# /etc/nginx/sites-available/mulkapi.conf  (symlink into sites-enabled)
# Replace mulkapi.duckdns.org with the real API host. Certificate: sudo certbot --nginx -d mulkapi.duckdns.org
server {
    listen 80;
    listen [::]:80;
    server_name mulkapi.duckdns.org;

    # Keep headers scoped to this API host. Browsers ignore HSTS over plain HTTP;
    # ensure this directive is also present in the TLS server block after Certbot.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
