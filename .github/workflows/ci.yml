name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run browser tests
        id: browser-tests
        run: pnpm test:browser
      - name: Upload browser artifacts on failure
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MulkYonetimi.slnx --locked-mode
      - run: dotnet build MulkYonetimi.slnx --no-restore --configuration Release
      - name: Check portfolio OpenAPI and API contract
        run: dotnet test MulkYonetimi.slnx --no-build --configuration Release --filter 'FullyQualifiedName~MulkYonetimi.Api.Tests.PropertyContractTests'
      - name: Run remaining backend tests
        run: dotnet test MulkYonetimi.slnx --no-build --configuration Release --filter 'FullyQualifiedName!~MulkYonetimi.Api.Tests.PropertyContractTests'
      - run: dotnet format MulkYonetimi.slnx --verify-no-changes --no-restore
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check generated OpenAPI client
        run: |
          ASPNETCORE_ENVIRONMENT=Development Email__WorkerEnabled=false Notifications__WorkerEnabled=false RentCharges__WorkerEnabled=false \
            dotnet src/MulkYonetimi.Api/bin/Release/net10.0/MulkYonetimi.Api.dll --urls http://127.0.0.1:5080 > "$RUNNER_TEMP/openapi-server.log" 2>&1 &
          curl --fail --retry 20 --retry-delay 1 --retry-connrefused http://127.0.0.1:5080/openapi/v1.json -o "$RUNNER_TEMP/openapi.json"
          cd ../frontend
          pnpm install --frozen-lockfile
          pnpm api:types
          git diff --exit-code -- lib/api/generated.ts
      - name: Prepare API and migration artifacts
        if: github.event_name == 'push'
        run: |
          dotnet publish src/MulkYonetimi.Api -c Release --no-build -o "${RUNNER_TEMP}/release/api"
          dotnet tool restore
          dotnet tool run dotnet-ef migrations script --idempotent --project src/MulkYonetimi.Infrastructure --startup-project src/MulkYonetimi.Api --context ApplicationDbContext --configuration Release --no-build --output "${RUNNER_TEMP}/release/migrate.sql"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: api-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU22-GDR1-ubuntu-22.04@sha256:bf438d7104f861f5e1e1ba14b063d60a5bd883964b3c9b3b3c0064536177baa5
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ${{ secrets.MULK_SQL_TEST_PASSWORD }}
        ports:
          - 14333:1433
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare ephemeral browser E2E credentials
        run: |
          printf 'MULK_SQL_E2E_ENABLED=true\n' >> "$GITHUB_ENV"
          printf 'MULK_SQL_E2E_DATABASE=MulkBrowserE2E_%s\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'MULK_SQL_E2E_EMAIL=browser-%s@example.test\n' "$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          printf 'MULK_SQL_E2E_PASSWORD=%sAa9!\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: dotnet restore tests/MulkYonetimi.IntegrationTests/MulkYonetimi.IntegrationTests.csproj --locked-mode
      - run: dotnet test tests/MulkYonetimi.IntegrationTests/MulkYonetimi.IntegrationTests.csproj --no-restore --configuration Release
        env:
          MULK_SQL_TEST_ADMIN_CONNECTION: Server=127.0.0.1,14333;Database=master;User Id=sa;Password=${{ secrets.MULK_SQL_TEST_PASSWORD }};Encrypt=True;TrustServerCertificate=True;Connect Timeout=10
      - run: dotnet format tests/MulkYonetimi.IntegrationTests/MulkYonetimi.IntegrationTests.csproj --verify-no-changes --no-restore
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
        env:
          BACKEND_BASE_URL: http://127.0.0.1:5080
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API against the isolated SQL E2E database
        run: |
          dotnet src/MulkYonetimi.Api/bin/Release/net10.0/MulkYonetimi.Api.dll --urls http://127.0.0.1:5080 > "$RUNNER_TEMP/sql-e2e-api.log" 2>&1 &
          api_pid=$!
          printf '%s\n' "$api_pid" > "$RUNNER_TEMP/sql-e2e-api.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5080/openapi/v1.json > /dev/null; then exit 0; fi
            sleep 1
          done
          kill "$api_pid" 2>/dev/null || true
          exit 1
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: Server=127.0.0.1,14333;Database=${{ env.MULK_SQL_E2E_DATABASE }};User Id=sa;Password=${{ secrets.MULK_SQL_TEST_PASSWORD }};Encrypt=True;TrustServerCertificate=True;Connect Timeout=10
          Auth__FrontendOrigin: http://127.0.0.1:3120
          Email__WorkerEnabled: 'false'
          Notifications__WorkerEnabled: 'false'
          RentCharges__WorkerEnabled: 'false'
      - name: Run browser flow against the SQL-backed API
        run: pnpm test:browser:sql
        working-directory: frontend
        env:
          MULK_SQL_E2E_API_URL: http://127.0.0.1:5080
          MULK_SQL_E2E_EMAIL: ${{ env.MULK_SQL_E2E_EMAIL }}
          MULK_SQL_E2E_PASSWORD: ${{ env.MULK_SQL_E2E_PASSWORD }}
